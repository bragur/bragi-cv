name: Preview CV

on:
  pull_request:

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4

      - name: Install Inter font
        run: sudo apt-get update && sudo apt-get install -y fonts-inter

      - name: Compile CV
        id: compile
        run: |
          typst compile --font-path /usr/share/fonts bragi_bergthorsson_cv.typ /tmp/cv.pdf
          typst compile --font-path /usr/share/fonts bragi_bergthorsson_cv.typ /tmp/preview-{n}.png
          echo "pages=$(ls /tmp/preview-*.png | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Push preview assets
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan preview
          git rm -rf .
          cp /tmp/cv.pdf /tmp/preview-*.png .
          git add cv.pdf preview-*.png
          git commit -m "Preview for PR #${{ github.event.pull_request.number }}"
          git push origin preview --force
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const pages = parseInt('${{ steps.compile.outputs.pages }}');
            const sha = '${{ steps.push.outputs.sha }}';
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;

            const pdfUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${sha}/cv.pdf`;

            let body = `### CV Preview\n\n`;
            body += `**[View PDF](${pdfUrl})**\n\n`;

            for (let i = 1; i <= pages; i++) {
              const url = `https://raw.githubusercontent.com/${owner}/${repo}/${sha}/preview-${i}.png`;
              body += `![Page ${i}](${url})\n\n`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber,
            });
            const existing = comments.find(c => c.body?.includes('### CV Preview'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
            }
